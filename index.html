<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>JxPan分享链接解析</title>
 <style>
 :root {
 color-scheme:light;
 --ink:#172238;
 --muted:#667085;
 --line:#dbe4f0;
 --paper:#fff;
 --accent:#0b6bcb;
 --accent-dark:#064d98;
 --error:#b42318;
 --shadow:0/**/22px/**/60px/**/rgba(24,46,78,.13);
 }

 * { box-sizing:border-box; }

 body {
 min-height:100vh;
 margin:0;
 padding:32px/**/16px;
 display:grid;
 place-items:center;
 color:var(--ink);
 font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;
 background:
 radial-gradient(circle at12%12%,rgba(48,143,230,.18),transparent28rem),
 radial-gradient(circle at88%88%,rgba(255,183,77,.24),transparent24rem),
 #edf3fa;
 }

 main {
 width:min(100%,720px);
 padding:clamp(24px,6vw,48px);
 border:1px solid rgba(255,255,255,.85);
 border-radius:24px;
 background:rgba(255,255,255,.94);
 box-shadow:var(--shadow);
 backdrop-filter:blur(12px);
 }

 .eyebrow {
 margin:0/**/0/**/10px;
 color:var(--accent);
 font-size:13px;
 font-weight:700;
 letter-spacing:.13em;
 text-transform:uppercase;
 }

 h1 {
 margin:0;
 font-family:Georgia,"Noto Serif SC",serif;
 font-size:clamp(30px,6vw,46px);
 line-height:1.08;
 letter-spacing:-.03em;
 }

 .intro {
 margin:14px/**/0/**/28px;
 color:var(--muted);
 line-height:1.7;
 }

 label {
 display:block;
 margin-bottom:9px;
 font-size:14px;
 font-weight:700;
 }

 textarea,
 input {
 width:100%;
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px/**/14px;
 color:var(--ink);
 background:var(--paper);
 font:inherit;
 outline:none;
 transition:border-color/**/160ms/**/ease, box-shadow/**/160ms/**/ease;
 }

 textarea {
 min-height:108px;
 resize:vertical;
 line-height:1.55;
 }

 textarea:focus,
 input:focus {
 border-color:var(--accent);
 box-shadow:0/**/0/**/0/**/4px/**/rgba(11,107,203,.12);
 }

 .options {
 display:grid;
 grid-template-columns:1fr/**/150px;
 gap:12px;
 margin-top:14px;
 }

 button {
 width:100%;
 margin-top:20px;
 border:0;
 border-radius:12px;
 padding:14px/**/18px;
 color:#fff;
 background:var(--accent);
 font:inherit;
 font-weight:700;
 cursor:pointer;
 transition:background/**/160ms/**/ease, transform/**/160ms/**/ease;
 }

 button:hover { background:var(--accent-dark); transform:translateY(-1px); }
 button:disabled { cursor:wait; opacity:.62; transform:none; }

 .status {
 min-height:24px;
 margin:16px/**/0;
 color:var(--muted);
 font-size:14px;
 line-height:1.6;
 }

 .status.error { color:var(--error); }

 .result {
 display:none;
 overflow:auto;
 max-height:420px;
 margin:14px/**/0;
 padding:16px;
 border:1px solid #263650;
 border-radius:12px;
 color:#dce8f7;
 background:#142033;
 font:13px/1.6/**/Consolas, "SFMono-Regular", monospace;
 white-space:pre-wrap;
 word-break:break-word;
 }

 .result.visible { display:block; }

 @media (max-width:560px) {
 body { padding:16px; }
 main { border-radius:18px; }
 .options { grid-template-columns:1fr; }
 }
 </style>
</head>
<body>
 <main>
 <p class="eyebrow">Pure Parse Mode</p>
 <h1>分享链接解析</h1>
 <p class="intro">粘贴网盘分享链接，获取文件列表或下载直链。无需登录，不保存解析记录。</p>

 <form id="parse-form">
 <label for="url">分享链接</label>
 <textarea id="url" name="url" required placeholder="https://pan.quark.cn/s/..."></textarea>

 <div class="options">
 <div>
 <label for="pwd">提取码（可选）</label>
 <input id="pwd" name="pwd" autocomplete="off">
 </div>
 <div>
 <label for="fid">文件夹 ID（可选）</label>
 <input id="fid" name="fid" autocomplete="off">
 </div>
 </div>

 <button id="submit" type="submit">开始解析</button>
 </form>

 <p id="status" class="status" aria-live="polite"></p>
 <pre id="result" class="result"></pre>
 </main>

 <script>
 const form = document.querySelector('#parse-form');
 const button = document.querySelector('#submit');
 const status = document.querySelector('#status');
 const result = document.querySelector('#result');

 form.addEventListener('submit', async (event) => {
 event.preventDefault();
 button.disabled = true;
 status.className = 'status';
 status.textContent = '正在请求解析服务…';
 result.className = 'result';

 const query = new URLSearchParams();
 for (const [key, value] of new FormData(form)) {
 if (String(value).trim()) query.set(key, String(value).trim());
 }

 try {
 const response = await fetch('/json/parser?' + query.toString(), {
 headers: { Accept: 'application/json' }
 });
 const payload = await response.json();
 status.textContent = response.ok && payload.success
 ? '解析请求已完成。'
 : '解析服务返回：' + (payload.msg || ('HTTP ' + response.status));
 result.textContent = JSON.stringify(payload, null,2);
 result.className = 'result visible';
 } catch (error) {
 status.className = 'status error';
 status.textContent = '请求失败：' + error.message;
 } finally {
 button.disabled = false;
 }
 });
 </script>
</body>
</html>
