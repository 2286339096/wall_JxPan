<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="description" content="WALLPIC壁纸收藏。">
 <title>WALLPIC</title>
 <style>
 :root {
 color-scheme: light;
 --ink: #12375a;
 --muted: #63809a;
 --blue: #1a82c4;
 --card: rgba(255,255,255, .78);
 }

 * {
 box-sizing: border-box;
 }

 body {
 min-height:100vh;
 margin:0;
 display: grid;
 place-items: center;
 padding:24px;
 color: var(--ink);
 background:
 radial-gradient(circle at16%11%, rgba(217,242,255,.9), transparent30rem),
 radial-gradient(circle at88%88%, rgba(255,240,201,.72), transparent28rem),
 #f7fbfe;
 font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei UI", sans-serif;
 }

 main {
 width: min(100%,680px);
 padding:64px;
 border:1px solid rgba(255,255,255, .92);
 border-radius:28px;
 background: var(--card);
 box-shadow:020px70px rgba(28,73,107, .12);
 backdrop-filter: blur(16px);
 }

 .mark {
 width:48px;
 height:48px;
 display: grid;
 place-items: center;
 border-radius:15px;
 color: #fff;
 background: var(--blue);
 font-size:20px;
 font-weight:800;
 transform: rotate(-6deg);
 }

 h1 {
 margin-top:28px;margin-right:0;margin-bottom:10px;margin-left:0;
 font-family: Georgia, "Noto Serif SC", serif;
 font-size: clamp(48px,10vw,84px);
 line-height: .95;
 letter-spacing: -.055em;
 font-weight:600;
 }

 p {
 margin-top:0;margin-right:0;margin-bottom:32px;margin-left:0;
 color: var(--muted);
 font-size:16px;
 line-height:1.8;
 }

a {
 display: inline-flex;
 align-items: center;
 gap:9px;
 padding-top:13px;
 padding-right:19px;
 padding-bottom:13px;
 padding-left:19px;
 border-radius:12px;
 color: #fff;
 background: var(--blue);
 font-size:14px;
 font-weight:700;
 text-decoration: none;
 }

 a::after {
 content: "→";
 }

 @media (max-width:520px) {
 body {
 padding:16px;
 }

 main {
 padding-top:38px;
 padding-right:28px;
 padding-bottom:38px;
 padding-left:28px;
 border-radius:22px;
 }
 }
 </style>
</head>
<body>
 <main>
 <div class="mark">W</div>
 <h1>WALLPIC</h1>
 <p>把喜欢的风景，留在屏幕上。</p>
 <a href="https://www.wallpic.cn/" target="_blank" rel="noopener noreferrer">浏览壁纸</a>
 </main>
</body>
</html>
